[tool.ruff]
target-version = "py313"
exclude = [".venv", ".local", "analysis_materials", "feedback/migrations"]

[tool.ruff.lint]
# Incremental baseline: syntax/name correctness without reformatting existing UI.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.13"
files = ["feedback/contracts.py"]
strict = true
