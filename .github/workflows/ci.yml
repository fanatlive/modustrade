name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: modus_ci
          POSTGRES_USER: modus_ci
          POSTGRES_PASSWORD: local-ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U modus_ci -d modus_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DEBUG: '1'
      DEMO_MODE: '1'
      DEMO_PASSWORD: local-ci-demo-password
      DB_ENGINE: postgres
      POSTGRES_DB: modus_ci
      POSTGRES_USER: modus_ci
      POSTGRES_PASSWORD: local-ci-ephemeral-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-ci.txt
      - run: ruff check .
      - run: mypy
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput
      - run: python manage.py collectstatic --noinput
      - run: python -m playwright install --with-deps chromium
      - name: Prepare isolated browser database
        run: |
          python -c "import psycopg,os; c=psycopg.connect(dbname='postgres',user=os.environ['POSTGRES_USER'],password=os.environ['POSTGRES_PASSWORD'],host='127.0.0.1',autocommit=True); c.execute('CREATE DATABASE modus_ci_browser'); c.close()"
      - name: Browser regressions
        env:
          POSTGRES_DB: modus_ci_browser
        run: |
          python manage.py migrate --noinput
          python manage.py load_demo
          python tests/run_browser_remediation.py
      - run: pip-audit -r requirements.txt -r requirements-dev.txt
      - run: docker build -t modus-feedback:ci .
