<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:24px 12px;background:#f3f4f6;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;border:1px solid #e5e7eb;">
    <tr><td style="padding:28px 28px 8px;font-size:13px;color:#6b7280;">Обратная связь Модус Трейд</td></tr>
    <tr><td style="padding:0 28px;">
      <p style="margin:0 0 16px;font-size:15px;">Здравствуйте, {{ name }}!</p>
      <p style="margin:0 0 4px;font-size:13px;color:#6b7280;">{{ lead }}</p>
      <p style="margin:0 0 24px;font-size:18px;font-weight:600;line-height:1.4;">{{ headline }}</p>
      <a href="{{ url }}" style="display:inline-block;background:#1f2937;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-size:15px;">Открыть обращение</a>
    </td></tr>
    <tr><td style="padding:28px;font-size:12px;color:#9ca3af;line-height:1.5;">Это автоматическое письмо, отвечать на него не нужно.<br><a href="{{ settings_url }}" style="color:#6b7280;">Настроить каналы уведомлений</a></td></tr>
  </table>
</body>
</html>
