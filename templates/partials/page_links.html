<nav class="pagination" aria-label="{{ label }}"><a class="page-arrow{% if not previous %} is-disabled{% endif %}" {% if previous %}href="{{ previous }}"{% else %}aria-disabled="true"{% endif %} aria-label="Предыдущая страница">{% include 'partials/icon.html' with icon='chevron' %}</a><ol>{% for link in links %}{% if link.gap %}<li class="page-gap" aria-hidden="true">…</li>{% elif link.current %}<li><span class="page-number is-current" aria-current="page">{{ link.number }}</span></li>{% else %}<li><a class="page-number" href="{{ link.url }}">{{ link.number }}</a></li>{% endif %}{% endfor %}</ol><a class="page-arrow{% if not next %} is-disabled{% endif %}" {% if next %}href="{{ next }}"{% else %}aria-disabled="true"{% endif %} aria-label="Следующая страница">{% include 'partials/icon.html' with icon='chevron' %}</a></nav>
