{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="Страницы результатов"><span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="button button-secondary button-small" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Назад</a>{% endif %}{% if page_obj.has_next %}<a class="button button-secondary button-small" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Далее</a>{% endif %}</div></nav>{% endif %}
