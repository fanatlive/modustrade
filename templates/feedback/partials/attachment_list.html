{% if files %}<ul class="attachment-list" aria-label="Вложения">{% for file in files %}<li><a class="attachment-item" href="{% url 'feedback:attachment' file.pk %}" download>{% if file.is_image %}<img class="attachment-thumb" src="{% url 'feedback:attachment' file.pk %}?inline=1" alt="" loading="lazy" width="44" height="44">{% else %}<span class="attachment-icon" aria-hidden="true">{% include 'partials/icon.html' with icon='file' %}</span>{% endif %}<span class="attachment-meta"><span class="attachment-name">{{ file.original_name }}</span><span class="attachment-size">{{ file.size|filesizeformat }}{% if file.visibility == 'internal' %} · только ответственным{% endif %}</span></span></a></li>{% endfor %}</ul>{% endif %}
