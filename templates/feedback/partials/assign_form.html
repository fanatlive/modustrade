<form method="post" action="{% url 'feedback:command' ticket.pk %}{% if detail_querystring %}?{{ detail_querystring }}{% endif %}" class="stack-form compact-form" data-submit-form>{% include 'partials/command_fields.html' with action_name='assign' %}<div class="field"><label for="assign-queue">Очередь</label><select id="assign-queue" name="queue_id">{% for queue in available_queues %}<option value="{{ queue.pk }}" {% if queue.pk == ticket.queue_id %}selected{% endif %}>{{ queue.name }}</option>{% endfor %}</select></div><div class="field"><label for="assign-user">Исполнитель</label><select id="assign-user" name="assignee_id">{% if ticket.status != 'IN_PROGRESS' and not awaiting_reassignment and info_request.resume_status != 'IN_PROGRESS' %}<option value="">Оставить в очереди разбора</option>{% endif %}{% for person in assignees %}<option value="{{ person.pk }}" {% if person.pk == ticket.assignee_id %}selected{% endif %}>{{ person }}</option>{% endfor %}</select></div>{% include 'feedback/partials/action_reason.html' with action_name='assign' %}<div class="decision-actions"><button class="button button-secondary" type="submit">Сохранить назначение</button></div></form>
