events { worker_connections 1024; }
http {
    server_tokens off;
    # Search parameters may contain private business text.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log safe;
    # Per-request upstream diagnostics include the original query in nginx's
    # fixed error format. Status/access metrics provide request diagnostics.
    error_log /var/log/nginx/error.log crit;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    client_max_body_size 256k;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        set $app_backend web:8000;
        location ~ ^/(accounts|admin)/login/?$ {
            limit_req zone=login burst=20 nodelay;
            proxy_pass http://$app_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # Only the two upload endpoints accept larger bodies (3 files x 10 MB + form).
        location ~ ^/requests/(new|[0-9a-f-]{36}/command)/$ {
            client_max_body_size 32m;
            proxy_pass http://$app_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
        location / {
            proxy_pass http://$app_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }
    }
}
